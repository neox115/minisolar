[env:kb2040_host]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#60d6ae81fcc73c34b1493ca9e261695e471bc0c2
board_build.core = earlephilhower
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#3.7.2
framework = arduino
build_flags = -DMESHTASTIC_I2C_SENSOR_HOST=1
board = adafruit_kb2040
lib_deps =
    nanopb/Nanopb@^0.4.8

[env:kb2040_client]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#60d6ae81fcc73c34b1493ca9e261695e471bc0c2
board_build.core = earlephilhower
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#3.7.2
framework = arduino
build_flags = #-DMESHTASTIC_I2C_SENSOR_HOST=0
board = adafruit_kb2040
lib_deps =
    nanopb/Nanopb@^0.4.8


[env:xiao_esp32s3_host]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags =
    -DMESHTASTIC_I2C_SENSOR_HOST=1
lib_deps =
    nanopb/Nanopb@^0.4.8
    adafruit/Adafruit MAX31865 library

[env:xiao_esp32s3_client]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags =
    -DMESHTASTIC_I2C_SENSOR_HOST=0
lib_deps =
    nanopb/Nanopb@^0.4.8
